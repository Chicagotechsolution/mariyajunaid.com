:root{--rose:#F9F1F2;--mulberry:#4A2434;--dusty:#C98A96;--gold:#B98F5A;--ink:#2C1A22;--hair:#E7D6D9}
*{box-sizing:border-box;margin:0}
body{background:var(--rose);color:var(--ink);font-family:"Jost",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.6;
background-image:radial-gradient(circle at 50% 0%, #fdf8f8 0%, var(--rose) 55%)}
.gate{max-width:420px;width:100%;text-align:center}
.gate svg.mono{display:block;margin:0 auto 20px}
h1{font-family:"Crimson Pro",Georgia,serif;font-weight:500;font-size:2rem;color:var(--mulberry)}
.sub{margin-top:10px;font-size:.95rem;color:#8a6670;max-width:38ch;margin-left:auto;margin-right:auto}
form{margin-top:30px;display:grid;gap:12px;text-align:left}
label{font-size:.9rem;font-weight:500;color:var(--mulberry)}
input[type=password]{width:100%;padding:13px 14px;border:1.5px solid var(--dusty);border-radius:3px;background:#fff;font:inherit;letter-spacing:.08em}
input[type=password]:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{padding:13px 16px;border:0;border-radius:3px;background:var(--mulberry);color:var(--rose);font:inherit;font-weight:500;cursor:pointer}
button:hover{background:#3a1b29}
button[disabled]{opacity:.6;cursor:wait}
.err{min-height:1.4em;font-size:.9rem;color:#9a4d4d;text-align:center}
.foot{margin-top:40px;font-size:.82rem;color:#b08f98}
@media (prefers-reduced-motion:no-preference){
